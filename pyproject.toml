[project]
name = "cluster-podcast-transcription"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "flashinfer-jit-cache==0.6.16.post3",
    "flashinfer-python==0.6.16.post3",
    "huggingface-hub>=1.27.0",
    "ipykernel>=7.3.0",
    "kaleido>=1.3.0",
    "kernels<=0.16.0,<0.17.0",
    "nbformat>=5.11.0",
    "openai>=1.0.0",
    "plotly>=6.9.0",
    "polars>=1.44.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.0.0",
    "tqdm>=4.67.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "vllm>=0.28.0",
    "wtpsplit>=2.2.1",
    "xgrammar>=0.2.3",
]

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer" }

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu130/"
explicit = true

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
    "py-spy>=0.4.2",
]
